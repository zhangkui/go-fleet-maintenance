# 零外部配置启动：docker compose up --build
services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd_2026
      MYSQL_DATABASE: fleet
      MYSQL_USER: fleet
      MYSQL_PASSWORD: fleet_pwd
      TZ: Asia/Shanghai
    command: ["mysqld",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--default-authentication-plugin=caching_sha2_password"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pwd_2026"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - fleet-net

  redis:
    image: redis:7.4.10-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - fleet-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "fleet:fleet_pwd@tcp(mysql:3306)/fleet?parseTime=true&loc=Asia%2FShanghai&charset=utf8mb4&collation=utf8mb4_unicode_ci"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_KEY_PREFIX: "fleet:"
      TOKEN_ISSUER: "go-fleet-maintenance"
      JWT_SECRET: "local-acceptance-secret-change-me"
      ACCESS_TOKEN_TTL: "30m"
      REFRESH_TOKEN_TTL: "168h"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "Admin123!"
      LOGIN_RATE_LIMIT: "5"
      LOGIN_RATE_WINDOW: "1m"
      TZ: "Asia/Shanghai"
      REQUEST_MAX_BYTES: "1048576"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # API 仅在 Compose 内部网络暴露；统一入口由 web(Nginx) 在 8080 提供。
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: "http://api:8080"
    # 统一入口：http://localhost:8080 （Nginx 静态前端 + /api 反向代理）
    ports:
      - "8080:80"
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
  redis-data:

networks:
  fleet-net:
    driver: bridge
